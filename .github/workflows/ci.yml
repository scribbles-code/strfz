name: ci

on:
  push:
  pull_request:

jobs:
  zig-0_16:
    strategy:
     fail-fast: false
     matrix:
       include:
        - zig: "0.16.0"
          os: ubuntu-latest
        - zig: "0.16.0"
          os: ubuntu-24.04-arm
        - zig: "0.16.0"
          os: windows-latest

    runs-on: ${{ matrix.os }}
      
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ matrix.zig }}
      - run: zig fmt --check build.zig src
      - run: zig build test --summary all

  zig-0_17:
    strategy:
     fail-fast: false
     matrix:
       include:
        - zig: "0.17.0"
          os: ubuntu-latest
        - zig: "0.17.0"
          os: ubuntu-24.04-arm
        - zig: "0.17.0"
          os: windows-latest

    runs-on: ${{ matrix.os }}
      
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ matrix.zig }}
      - run: zig fmt --check build.zig src
      - run: zig build test --summary all

  zig-master:
    strategy:
     fail-fast: false
     matrix:
       include:
        - zig: "master"
          os: ubuntu-latest
        - zig: "master"
          os: ubuntu-24.04-arm
        - zig: "master"
          os: windows-latest

    runs-on: ${{ matrix.os }}
      
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ matrix.zig }}
      - run: zig fmt --check build.zig src
      - run: zig build test --summary all


